# =============================================================================
# CityFoam — Docker Compose (v3)
# =============================================================================
#
# Start everything:
#   docker compose up --build
#
# Start only the app (Azure OpenAI, no local Ollama):
#   docker compose up app
#
# Start with local Ollama instead:
#   docker compose --profile ollama up
#
# View MLflow experiment results:
#   docker compose --profile mlflow up
#   Then open: http://localhost:5000
#
# Services
# --------
#   app      — FastAPI server  (port 8000)
#   ollama   — Local LLM       (port 11434)  [profile: ollama]
#   mlflow   — MLflow UI       (port 5000)   [profile: mlflow]
# =============================================================================

services:

  # ── Main application ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cityfoam-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env                    # rename _env → .env before running
    environment:
      # Override OLLAMA_BASE_URL so the app reaches the ollama container
      # (ignored when LLM_PROVIDER=azure)
      OLLAMA_BASE_URL: http://ollama:11434
      # Ensure PyTorch-only path — no TF noise
      TRANSFORMERS_NO_TF: "1"
      TF_ENABLE_ONEDNN_OPTS: "0"
    volumes:
      # Persist ChromaDB and monitoring DB across restarts
      - chroma_data:/app/chroma_db
      - monitoring_data:/app/monitoring_db
      - mlruns_data:/app/mlruns
      # Mount data folder so you can add/update KB files without rebuilding
      - ./data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
        required: false          # don't fail if ollama profile is not active
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s          # give ingest time to finish on first boot

  # ── Local Ollama (optional — activate with --profile ollama) ──────────
  ollama:
    image: ollama/ollama:latest
    container_name: cityfoam-ollama
    profiles: [ollama]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Pull the model automatically on first start
    entrypoint: ["/bin/sh", "-c",
      "ollama serve & sleep 5 && ollama pull qwen2.5:3b && wait"]

  # ── MLflow tracking UI (optional — activate with --profile mlflow) ────
  mlflow:
    # Remove "profiles" line below to always start MLflow with the app
    image: python:3.11-slim
    container_name: cityfoam-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlruns_data:/mlruns
    command: >
      bash -c "pip install mlflow --quiet &&
               mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns"

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  chroma_data:
  monitoring_data:
  mlruns_data:
  ollama_models: