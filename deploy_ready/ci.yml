name: CityFoam CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ---------------------------------------------------------------------------
# Global env — override in repo Settings → Secrets and variables → Actions
# ---------------------------------------------------------------------------
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cityfoam-rag
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Lint + basic checks  (runs on every push / PR)
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint deps
        run: pip install flake8 flake8-bugbear isort

      - name: flake8
        run: |
          flake8 server.py admin.py monitoring.py rag_eval.py app_secrets.py ingest.py \
            --max-line-length=100 \
            --extend-ignore=E203,W503

      - name: import order (isort)
        run: isort --check --diff server.py admin.py monitoring.py rag_eval.py app_secrets.py ingest.py

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests  (runs on every push / PR)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          LLM_PROVIDER: ollama         # use Ollama stub so no real API calls
          OLLAMA_BASE_URL: http://invalid-host   # will be mocked
          CHROMA_DB_DIR: /tmp/test_chroma
          COLLECTION_NAME: test_collection
          DATA_DIR: ./data

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Docker build + push to GHCR  (main branch only)
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write      # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Deploy  (main branch, after image is pushed)
  # Adjust this step to match your hosting: Azure Container Apps, Railway,
  # Fly.io, AWS ECS, etc.  The example below uses SSH deploy.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production     # enables manual approval gate in GitHub UI

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop cityfoam || true
            docker rm   cityfoam || true
            docker run -d \
              --name cityfoam \
              --restart unless-stopped \
              -p 8000:8000 \
              -e LLM_PROVIDER=azure \
              -e AZURE_KEYVAULT_URL=${{ secrets.AZURE_KEYVAULT_URL }} \
              -v /opt/cityfoam/chroma_db:/app/chroma_db \
              -v /opt/cityfoam/data:/app/data \
              ${{ env.IMAGE_NAME }}:latest
