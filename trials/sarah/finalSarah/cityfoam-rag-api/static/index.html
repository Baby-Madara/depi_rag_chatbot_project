<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityFoam AI Support</title>
    <link rel="icon" href="data:,"> 
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2 id="company-name">CityFoam</h2>
            </div>
            <button id="new-chat-btn" class="new-chat-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New Chat
            </button>
            <div class="chat-history">
                <p class="section-title">Recent</p>
                <ul id="history-list">
                    <!-- Dynamically populated by JS -->
                </ul>
            </div>
            <div class="sidebar-footer">
                <div id="user-info" class="user-info">
                    <div class="avatar">G</div>
                    <span>Guest User</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main id="chat-window" class="chat-window">
            <header class="chat-header">
                <button id="toggle-sidebar" class="icon-btn" title="...">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h3 id="chat-title">AI Assistant</h3>
                <div class="theme-toggle">
                    <button id="toggle-theme" class="icon-btn" title="...">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    </button>
                </div>
            </header>

            <div id="messages-container" class="messages-container">
                <!-- Dynamically populated by JS -->
            </div>

            <div class="input-area">
                <form id="chat-form" class="chat-form">
                    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
                    <button type="submit" id="send-btn" class="send-btn" title="...">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
                <div class="footer-text">Responses may be generated by AI. Check for accuracy.</div>
            </div>
        </main>
    </div>

    <script src="/static/main.js?v=2"></script>
</body>
</html>
